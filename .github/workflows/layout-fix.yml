name: Apply Layout Stability Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-layout-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add layout fix stylesheet to HTML pages
        shell: bash
        run: |
          set -e
          changed=0
          for file in *.html; do
            if [ -f "$file" ] && ! grep -q 'css/layout-fix.css' "$file"; then
              python3 - "$file" <<'PY'
import sys
from pathlib import Path
p = Path(sys.argv[1])
s = p.read_text(encoding='utf-8')
needle = '<link rel="stylesheet" href="css/style.css">'
replacement = needle + '\n    <link rel="stylesheet" href="css/layout-fix.css?v=1">'
if needle in s:
    s = s.replace(needle, replacement, 1)
    p.write_text(s, encoding='utf-8')
PY
              changed=1
            fi
          done

          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add '*.html'
            git commit -m "Apply layout stability stylesheet"
            git push
          fi

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/layout-fix.yml
          if git diff --quiet -- .github/workflows/layout-fix.yml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github/workflows/layout-fix.yml
          git commit -m "Remove temporary layout fix workflow"
          git push
