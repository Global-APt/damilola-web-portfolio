name: Global-Apt Favicon Fix

on:
  workflow_run:
    workflows: ["Final SEO Cleanup"]
    types: [completed]

permissions:
  contents: write

jobs:
  fix-favicon:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Standardize favicon on homepage and SEO page
        shell: python
        run: |
          from pathlib import Path
          import re

          favicon = 'images/global-apt-logo-webp.webp?v=4'
          for filename in ('index.html', 'seo.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              icon_tag = re.compile(r'\s*<link[^>]+rel=["\']icon["\'][^>]*>', re.I)
              s = icon_tag.sub('', s)
              head_end = s.lower().find('</head>')
              if head_end != -1:
                  s = s[:head_end] + f'    <link rel="icon" type="image/webp" href="{favicon}">\n' + s[head_end:]
              p.write_text(s, encoding='utf-8')

      - name: Commit favicon fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html seo.html
          if git diff --cached --quiet; then
            echo "No favicon changes required."
          else
            git commit -m "Fix Global-Apt favicon after SEO cleanup"
            git push
          fi
