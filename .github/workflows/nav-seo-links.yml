name: Standardize SEO Navigation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  standardize-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add SEO link to HTML navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'href="seo.html"' in text:
                  continue

              pattern = r'(<a\s+href="services\.html"[^>]*>.*?</a>)'
              replacement = r'\1<a href="seo.html">SEO</a>'
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)

              if count:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(path.name)

          print('Updated:', ', '.join(changed) if changed else 'No files needed changes')

      - name: Commit navigation updates and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git rm .github/workflows/nav-seo-links.yml
          if git diff --cached --quiet; then
            echo "No navigation changes required."
            exit 0
          fi
          git commit -m "Standardize SEO navigation links"
          git push
