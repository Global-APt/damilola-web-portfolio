name: Homepage SEO Optimization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Improve homepage search relevance
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '<title>Akinrefon Damilola Rufus | Global-Apt Media & Technologies</title>':
              '<title>Akinrefon Damilola Rufus | Global-Apt IT Solutions in Osogbo</title>',
              'content="Akinrefon Damilola Rufus is the founder of Global-Apt Media & Technologies, providing web development, IT support, website maintenance, SEO, hosting, DNS, CCTV and smart home technology solutions."':
              'content="Akinrefon Damilola Rufus is the founder of Global-Apt Media & Technologies, providing IT support, web development, SEO, computer services, CCTV and smart home technology solutions in Osogbo, Osun State, Nigeria."',
              'content="Technology, web development, IT support, SEO, CCTV and smart home solutions from Global-Apt Media & Technologies."':
              'content="IT support, web development, SEO, computer, CCTV and smart home solutions from Global-Apt Media & Technologies in Osogbo, Nigeria."',
              'Technology Solutions\n                        <span>That Keep Your Business Moving.</span>':
              'IT & Technology Solutions in Osogbo\n                        <span>That Keep Your Business Moving.</span>',
              '<h2>\n                        Practical Technology Solutions\n                        for Your Digital Operations.\n                    </h2>':
              '<h2>\n                        Practical IT &amp; Technology Solutions in Osogbo.\n                    </h2>',
          }

          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/homepage-seo-optimization.yml
          git commit -m "Optimize homepage for Osogbo IT searches"
          git rm .github/workflows/homepage-seo-optimization.yml
          git commit -m "Remove temporary homepage SEO workflow"
          git push
