name: Expand Service Internal Links

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  links:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add missing specialist links
        shell: python
        run: |
          from pathlib import Path

          targets = [
              ('index.html', '07', '''
            <article class="service-card">
                <div class="service-number">08</div>
                <h3>Computer Repair &amp; Maintenance</h3>
                <p>Computer troubleshooting, repairs, maintenance and practical technical support for homes, offices and businesses.</p>
                <a href="computer-repair-maintenance.html">View Computer Repair →</a>
            </article>
            <article class="service-card">
                <div class="service-number">09</div>
                <h3>General Technology Training</h3>
                <p>Practical technology training for individuals, staff and organizations seeking useful digital and IT skills.</p>
                <a href="general-training.html">View Technology Training →</a>
'''),
              ('services.html', '11', '''
            <article class="service-card">
                <div class="service-number">12</div>
                <h3>Computer Repair &amp; Maintenance</h3>
                <p>Computer troubleshooting, repairs, maintenance and practical technical support for homes, offices and businesses.</p>
                <a href="computer-repair-maintenance.html">View Service →</a>
            </article>
            <article class="service-card">
                <div class="service-number">13</div>
                <h3>General Technology Training</h3>
                <p>Practical technology training for individuals, staff and organizations seeking useful digital and IT skills.</p>
                <a href="general-training.html">View Service →</a>
''')
          ]

          for filename, service_number, block in targets:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if 'computer-repair-maintenance.html' in s:
                  continue
              marker = f'<div class="service-number">{service_number}</div>'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit(f'Marker not found: {filename}')
              end = s.find('</article>', pos)
              if end < 0:
                  raise SystemExit(f'Article end not found: {filename}')
              end += len('</article>')
              p.write_text(s[:end] + block + s[end:], encoding='utf-8')

      - name: Verify
        run: |
          grep -q 'computer-repair-maintenance.html' index.html
          grep -q 'general-training.html' index.html
          grep -q 'computer-repair-maintenance.html' services.html
          grep -q 'general-training.html' services.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html
          if git diff --cached --quiet; then
            echo "Links already present."
          else
            git commit -m "Expand specialist service internal links"
            git push
          fi
