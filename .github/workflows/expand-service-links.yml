name: Expand Service Internal Links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add missing specialist service links
        shell: python
        run: |
          from pathlib import Path

          additions = {
              'index.html': '''            <article class="service-card">
                <div class="service-number">08</div>
                <h3>Computer Repair &amp; Maintenance</h3>
                <p>Computer troubleshooting, repairs, maintenance and practical technical support for homes, offices and businesses.</p>
                <a href="computer-repair-maintenance.html">View Computer Repair →</a>
            </article>
            <article class="service-card">
                <div class="service-number">09</div>
                <h3>General Technology Training</h3>
                <p>Practical technology training for individuals, staff and organizations seeking useful digital and IT skills.</p>
                <a href="general-training.html">View Technology Training →</a>
''',
              'services.html': '''            <article class="service-card">
                <div class="service-number">12</div>
                <h3>Computer Repair &amp; Maintenance</h3>
                <p>Computer troubleshooting, repairs, maintenance and practical technical support for homes, offices and businesses.</p>
                <a href="computer-repair-maintenance.html">View Service →</a>
            </article>
            <article class="service-card">
                <div class="service-number">13</div>
                <h3>General Technology Training</h3>
                <p>Practical technology training for individuals, staff and organizations seeking useful digital and IT skills.</p>
                <a href="general-training.html">View Service →</a>
'''
          }

          for filename, block in additions.items():
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if 'computer-repair-maintenance.html' not in s:
                  marker = '<article class="service-card">\n                <div class="service-number">07</div>' if filename == 'index.html' else '<article class="service-card">\n                <div class="service-number">11</div>'
                  pos = s.find(marker)
                  if pos != -1:
                      # Insert after the complete 07/11 article by locating its closing article tag.
                      end = s.find('</article>', pos)
                      if end != -1:
                          end += len('</article>')
                          s = s[:end] + '\n' + block.rstrip() + s[end:]
              p.write_text(s, encoding='utf-8')

      - name: Verify links
        run: |
          grep -q 'computer-repair-maintenance.html' index.html
          grep -q 'general-training.html' index.html
          grep -q 'computer-repair-maintenance.html' services.html
          grep -q 'general-training.html' services.html

      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/expand-service-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html .github/workflows/expand-service-links.yml
          git commit -m "Expand specialist service internal links"
          git push
