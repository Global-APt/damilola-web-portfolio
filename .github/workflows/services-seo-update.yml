name: Services SEO Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-services-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update services SEO metadata and structured data
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('services.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '<meta name="description"\n        content="Web Support, Website Maintenance and IT Support services by Akinrefon Damilola Rufus.">': '<meta name="description" content="IT support, website maintenance, WordPress, hosting, DNS, networking and practical technology services serving Ido, Osogbo and across Osun State, Nigeria.">',
              '<title>Services | Akinrefon Damilola Rufus</title>': '<title>IT &amp; Web Services in Osogbo, Nigeria | Global-Apt</title>',
              '<meta property="og:title" content="Services | Akinrefon Damilola Rufus | Global-Apt">': '<meta property="og:title" content="IT &amp; Web Services in Osogbo, Nigeria | Global-Apt">',
              '<meta property="og:description" content="Web development, website maintenance, SEO, hosting, DNS, IT support, CCTV and smart technology services from Global-Apt Media &amp; Technologies.">': '<meta property="og:description" content="IT support, website maintenance, WordPress, hosting, DNS, networking and practical technology services from Global-Apt Media &amp; Technologies in Osogbo and across Osun State.">',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected text: {old}')
              text = text.replace(old, new, 1)

          marker = '    <link rel="icon" type="image/webp" href="images/global-apt-logo-webp.webp?v=2">\n'
          structured_data = '''    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"WebPage",
      "@id":"https://globalaptech.online/services.html#webpage",
      "name":"IT & Web Services in Osogbo, Nigeria",
      "url":"https://globalaptech.online/services.html",
      "description":"IT support, website maintenance, WordPress, hosting, DNS, networking and practical technology services serving Ido, Osogbo and across Osun State, Nigeria.",
      "about":{"@id":"https://globalaptech.online/#business"},
      "isPartOf":{"@id":"https://globalaptech.online/#website"}
    }
    </script>
    <script type="application/ld+json">
    {
      "@context":"https://schema.org",
      "@type":"BreadcrumbList",
      "@id":"https://globalaptech.online/services.html#breadcrumb",
      "itemListElement":[
        {"@type":"ListItem","position":1,"name":"Home","item":"https://globalaptech.online/"},
        {"@type":"ListItem","position":2,"name":"Services","item":"https://globalaptech.online/services.html"}
      ]
    }
    </script>
'''
          if marker not in text:
              raise SystemExit('Expected favicon marker not found')
          text = text.replace(marker, marker + structured_data, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit SEO update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/services-seo-update.yml
          git add services.html .github/workflows/services-seo-update.yml
          git diff --cached --quiet && exit 0
          git commit -m "Strengthen services hub SEO"
          git push
