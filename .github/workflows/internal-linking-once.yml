name: Global-Apt Internal Linking

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  strengthen-internal-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add internal service links
        shell: python
        run: |
          from pathlib import Path

          marker = '<!-- GLOBAL-APT SERVICE LANDING LINKS -->'
          links = '''
          <!-- GLOBAL-APT SERVICE LANDING LINKS -->
          <section class="services-preview" aria-label="Featured local technology services">
              <div class="container">
                  <div class="section-heading">
                      <p class="eyebrow">SPECIALIST SERVICES</p>
                      <h2>Technology Services in Osogbo &amp; Nigeria.</h2>
                      <p>Explore dedicated service pages for computer sales, CCTV installation and smart home automation.</p>
                  </div>
                  <div class="service-grid">
                      <article class="service-card">
                          <div class="service-number">05</div>
                          <h3>Computer Sales &amp; IT Equipment</h3>
                          <p>Laptops, desktops, computer accessories and technical support for customers in Osogbo and across Nigeria.</p>
                          <a href="computer-sales.html">View Computer Sales →</a>
                      </article>
                      <article class="service-card">
                          <div class="service-number">06</div>
                          <h3>CCTV Installation</h3>
                          <p>CCTV installation, configuration and technical support for homes, offices, shops, hotels and organizations.</p>
                          <a href="cctv-installation.html">View CCTV Services →</a>
                      </article>
                      <article class="service-card">
                          <div class="service-number">07</div>
                          <h3>Smart Home Automation</h3>
                          <p>Connected lighting, smart security and compatible device setup for homes, offices and properties.</p>
                          <a href="smart-home-automation.html">View Smart Home Services →</a>
                      </article>
                  </div>
              </div>
          </section>
          '''

          def inject_once(path, anchor, block):
              p = Path(path)
              if not p.exists():
                  return False
              s = p.read_text(encoding='utf-8')
              if marker in s:
                  return False
              pos = s.find(anchor)
              if pos == -1:
                  return False
              s = s[:pos] + block + '\n\n' + s[pos:]
              p.write_text(s, encoding='utf-8')
              return True

          changed = False
          changed |= inject_once('index.html', '<!-- =========================================\n             GLOBAL-Apt STORE', links)

          service_links = '''
          <!-- GLOBAL-APT SERVICE LANDING LINKS -->
          <section class="services-preview" aria-label="Specialist technology services">
              <div class="container">
                  <div class="section-heading">
                      <p class="eyebrow">SPECIALIST SERVICES</p>
                      <h2>Explore Dedicated Technology Services.</h2>
                      <p>Find focused information about computer sales, CCTV installation and smart home automation in Osogbo and across Nigeria.</p>
                  </div>
                  <div class="service-grid">
                      <article class="service-card">
                          <div class="service-number">09</div>
                          <h3>Computer Sales &amp; IT Equipment</h3>
                          <p>Laptops, desktops, accessories and practical technical support.</p>
                          <a href="computer-sales.html">View Service →</a>
                      </article>
                      <article class="service-card">
                          <div class="service-number">10</div>
                          <h3>CCTV Installation</h3>
                          <p>Security camera installation, configuration and maintenance support.</p>
                          <a href="cctv-installation.html">View Service →</a>
                      </article>
                      <article class="service-card">
                          <div class="service-number">11</div>
                          <h3>Smart Home Automation</h3>
                          <p>Smart lighting, security technology and compatible device integration.</p>
                          <a href="smart-home-automation.html">View Service →</a>
                      </article>
                  </div>
              </div>
          </section>
          '''
          changed |= inject_once('services.html', '<!-- =========================================\n             SUPPORT PROCESS', service_links)

          if not changed:
              print('No changes required.')

      - name: Commit changes and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html .github/workflows/internal-linking-once.yml
          if git diff --cached --quiet; then
            echo "No changes required."
          else
            git rm .github/workflows/internal-linking-once.yml
            git add index.html services.html
            git commit -m "Strengthen internal links for specialist services"
            git push
          fi
