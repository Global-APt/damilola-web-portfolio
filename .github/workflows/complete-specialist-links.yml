name: Complete Specialist Service Links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add missing specialist links
        run: |
          python - <<'PY'
          from pathlib import Path
          updates = {
            'index.html': ('smart-home-automation.html', '''\n            <article class="service-card">\n                <div class="service-number">08</div>\n                <h3>Computer Repair &amp; Maintenance</h3>\n                <p>Computer troubleshooting, repairs, maintenance and practical technical support for homes, offices and businesses.</p>\n                <a href="computer-repair-maintenance.html">View Computer Repair →</a>\n            </article>\n            <article class="service-card">\n                <div class="service-number">09</div>\n                <h3>General Technology Training</h3>\n                <p>Practical technology training for individuals, staff and organizations seeking useful digital and IT skills.</p>\n                <a href="general-training.html">View Technology Training →</a>\n            </article>\n'''),
            'services.html': ('smart-home-automation.html', '''\n            <article class="service-card">\n                <div class="service-number">12</div>\n                <h3>Computer Repair &amp; Maintenance</h3>\n                <p>Computer troubleshooting, repairs, maintenance and practical technical support for homes, offices and businesses.</p>\n                <a href="computer-repair-maintenance.html">View Service →</a>\n            </article>\n            <article class="service-card">\n                <div class="service-number">13</div>\n                <h3>General Technology Training</h3>\n                <p>Practical technology training for individuals, staff and organizations seeking useful digital and IT skills.</p>\n                <a href="general-training.html">View Service →</a>\n            </article>\n''')
          }
          for filename, (needle, block) in updates.items():
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              if 'computer-repair-maintenance.html' in s and 'general-training.html' in s:
                  continue
              marker = f'<a href="{needle}">'
              pos = s.find(marker)
              if pos < 0:
                  raise SystemExit(f'Marker not found in {filename}')
              article_end = s.find('</article>', pos)
              if article_end < 0:
                  raise SystemExit(f'Article end not found in {filename}')
              article_end += len('</article>')
              s = s[:article_end] + block + s[article_end:]
              p.write_text(s, encoding='utf-8')
          PY
      - name: Verify links
        run: |
          grep -q 'computer-repair-maintenance.html' index.html
          grep -q 'general-training.html' index.html
          grep -q 'computer-repair-maintenance.html' services.html
          grep -q 'general-training.html' services.html
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html services.html .github/workflows/complete-specialist-links.yml
          git commit -m "Complete specialist service internal links"
          git rm .github/workflows/complete-specialist-links.yml
          git commit -m "Remove one-time specialist link workflow"
          git push
